name: Check the site

# Runs the site's own checks whenever its code changes: lint, the model's
# tests, and a full build. A red cross here means the change broke something.

on:
  push:
    branches: [dev]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
